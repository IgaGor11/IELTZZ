name: Build iOS .ipa


on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

permissions:
  contents: write


jobs:
  build:
    # Важно: Сборка iOS возможна только на macOS.
    # macos-15: ищем стабильный Xcode 16 (26.6 крашится)
    runs-on: macos-15


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Select Xcode version
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          echo "=== Доступные Xcode ===" | tee "$RUNNER_TEMP/build/xcode-list.txt"
          ls -d /Applications/Xcode*.app 2>/dev/null | tee -a "$RUNNER_TEMP/build/xcode-list.txt" || true
          # Xcode 26.6 крашится (build service crash) -> пробуем стабильный Xcode 16
          X16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -n 1)"
          if [ -n "$X16" ]; then
            echo "Выбираю $X16"
            sudo xcode-select -s "$X16/Contents/Developer" || true
          else
            echo "Xcode 16 не найден, остаёмся на дефолтном"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true


      # (Опционально) Шаг для Flutter/React Native проектов:
      # - name: Install Flutter / Node.js dependencies
      #   run: |
      #     flutter pub get
      #     flutter build ios --no-codesign


      - name: Build Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/build"
          # Меньше параллелизма = меньше крашей Xcode 26.6 на runner-е
          defaults write com.apple.dt.Xcode IDEBuildOperationMaxNumberOfConcurrentCompileTasks 2 || true
          for ATTEMPT in 1 2 3; do
            echo "--- Попытка сборки $ATTEMPT из 3 ---"
            rm -rf "$RUNNER_TEMP/build/unsigned" "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/build/IELTZZ-unsigned.ipa"
            mkdir -p "$RUNNER_TEMP/build/unsigned" "$RUNNER_TEMP/build"
            if xcodebuild \
              -project WordFlow500.xcodeproj \
              -scheme WordFlow500 \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO \
              SKIP_INSTALL=YES \
              BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
              SWIFT_COMPILATION_MODE=singlefile \
              build CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build/unsigned" 2>&1 | tee "$RUNNER_TEMP/build/unsigned-build.log"; then
              echo "Сборка прошла на попытке $ATTEMPT"
              break
            fi
            echo "Попытка $ATTEMPT упала (часто: Xcode build system has crashed) — чистим DerivedData, ждём 30 сек и повторяем"
            rm -rf ~/Library/Developer/Xcode/DerivedData/WordFlow500-* || true
            sleep 30
            if [ "$ATTEMPT" = "3" ]; then
              echo "Сборка не удалась после 3 попыток"
              tail -n 100 "$RUNNER_TEMP/build/unsigned-build.log" || true
              exit 1
            fi
          done
          ls -lh "$RUNNER_TEMP/build/unsigned/" || true
          test -d "$RUNNER_TEMP/build/unsigned/WordFlow500.app"


      - name: Export IPA (Payload -> zip, без подписи)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          rm -rf Payload
          mkdir -p Payload build
          cp -R "build/unsigned/WordFlow500.app" "Payload/"
          xattr -cr Payload || true
          rm -f build/IELTZZ-unsigned.ipa
          zip -r build/IELTZZ-unsigned.ipa Payload > /dev/null
          rm -rf Payload
          ls -lh build/
          unzip -l build/IELTZZ-unsigned.ipa | head -n 20


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ipa
          path: ${{ runner.temp }}/build/*.ipa


      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build/unsigned-build.log
          if-no-files-found: ignore

      - name: Publish build log to ci-logs (only on failure)
        if: failure()
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          LOG_SRC="$RUNNER_TEMP/build/unsigned-build.log"
          [ -f "$LOG_SRC" ] || echo "no log" > "$LOG_SRC"
          tail -n 120 "$LOG_SRC" > /tmp/tail.log || true
          cp "$LOG_SRC" /tmp/full.log || true
          cp "$RUNNER_TEMP/build/xcode-list.txt" /tmp/xcode-list.txt || echo "no xcode list" > /tmp/xcode-list.txt
          git fetch origin ci-logs || true
          if git show-ref --verify --quiet refs/remotes/origin/ci-logs; then git checkout ci-logs; else git checkout --orphan ci-logs; git rm -rf . || true; fi
          cp /tmp/full.log "./build-${GITHUB_RUN_ID}.log" || true
          cp /tmp/tail.log "./build-${GITHUB_RUN_ID}-tail.log" || true
          cp /tmp/xcode-list.txt "./xcode-${GITHUB_RUN_ID}.txt" || true
          echo "# CI logs" > README.md
          git add "build-${GITHUB_RUN_ID}.log" "build-${GITHUB_RUN_ID}-tail.log" "xcode-${GITHUB_RUN_ID}.txt" README.md || true
          git commit -m "ci log ${GITHUB_RUN_ID}" || true
          git push origin ci-logs || git push --set-upstream origin ci-logs
