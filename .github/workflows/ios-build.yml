name: Build iOS .ipa


on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную


jobs:
  build:
    runs-on: macos-14


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Archive
        run: |
          xcodebuild -project WordFlow500.xcodeproj \
            -scheme WordFlow500 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -allowProvisioningUpdates


      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates