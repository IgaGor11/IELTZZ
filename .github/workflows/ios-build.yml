name: Build iOS .ipa


on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную


jobs:
  build:
    runs-on: macos-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode-16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || xcode-select -print-path


      - name: Build Archive
        run: |
          xcodebuild -project WordFlow500.xcodeproj \
            -scheme WordFlow500 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=""


      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_STYLE=Manual


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ipa
          path: $RUNNER_TEMP/build/*.ipa