name: Build iOS .ipa


on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную


jobs:
  build:
    # Важно: Сборка iOS возможна только на macOS
    runs-on: macos-14 


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Создание переменных путей
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db


          # Декодирование сертификатов из Secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH


          # Создание временного keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH


          # Импорт сертификата в keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH


          # Размещение профиля обеспечения в нужную папку Xcode
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          
      - name: Select Xcode version
        run: xcode-select -s /Applications/Xcode.app/Contents/Developer


      # (Опционально) Шаг для Flutter/React Native проектов:
      # - name: Install Flutter / Node.js dependencies
      #   run: |
      #     flutter pub get
      #     flutter build ios --no-codesign


      - name: Build Archive
        run: |
          xcodebuild -project WordFlow500.xcodeproj \
            -scheme WordFlow500 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            archive


      - name: Export IPA
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          # Создание ExportOptions.plist из секретов (или генерация на лету)
          echo "$EXPORT_OPTIONS_PLIST" > $RUNNER_TEMP/ExportOptions.plist
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -exportPath $RUNNER_TEMP/build \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ipa
          path: ${{ runner.temp }}/build/*.ipa