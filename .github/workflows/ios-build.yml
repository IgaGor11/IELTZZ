name: Build iOS .ipa


on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную


jobs:
  build:
    # Важно: Сборка iOS возможна только на macOS
    runs-on: macos-14 


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer


      # (Опционально) Шаг для Flutter/React Native проектов:
      # - name: Install Flutter / Node.js dependencies
      #   run: |
      #     flutter pub get
      #     flutter build ios --no-codesign


      - name: Build unsigned Archive (no code signing required)
        run: |
          xcodebuild -project WordFlow500.xcodeproj \
            -scheme WordFlow500 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=""


      - name: Export unsigned IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/IELTZZ.xcarchive \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_STYLE=Manual


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ipa
          path: $RUNNER_TEMP/build/*.ipa