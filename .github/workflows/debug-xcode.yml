name: Debug Xcode versions


on:
  push:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  debug:
    runs-on: macos-latest
    steps:
      - name: List all Xcode apps
        run: |
          echo "=== All Xcode in /Applications ==="
          ls -la /Applications/ | grep -i xcode
          echo ""
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo ""
          echo "=== xcode-select -print-path ==="
          xcode-select -print-path
          echo ""
          echo "=== which xcodebuild ==="
          which xcodebuild
          echo ""
          echo "=== Available sdks ==="
          xcodebuild -showsdks