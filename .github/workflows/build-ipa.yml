name: Build IPA (Native)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project WordFlow500.xcodeproj \
            -scheme WordFlow500 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/IELTZZ.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/IELTZZ.xcarchive \
            -exportOptionsPlist Distribution/ExportOptions-AdHoc.plist \
            -exportPath $PWD/build \
            -allowProvisioningUpdates

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IELTZZ-IPA
          path: build/*.ipa

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IELTZZ-dSYMs
          path: build/*.dSYM.zip
          if-no-files-found: ignore
